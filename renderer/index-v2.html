<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>FilePilot</title>
    <link rel="stylesheet" href="styles-v2.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 5.5h9.5L24 11v15.5H9z"/><path d="M18.5 5.5V11H24"/><path d="M12.8 17h7M12.8 21h4.6"/></svg></span>
        <div><b>FilePilot</b><span>万能文件助手</span></div>
      </div>
      <div class="top-actions">
        <div class="privacy"><i></i>仅在本机处理</div>
        <button class="out-btn" id="outputButton" title="更改输出文件夹">
          <svg viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2h9v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
          <span><small>保存到</small><strong id="outputLabel">FilePilot Output</strong></span>
        </button>
        <button class="ghost" id="newTaskButton">＋ 新任务</button>
      </div>
    </header>

    <main class="page">
      <!-- 空态 -->
      <section class="empty" id="emptyView">
        <div class="hero"><h1>文件处理，本该简单一点</h1><p>把文件拖进来，FilePilot 会自动告诉你可以做什么。</p></div>
        <div class="dropzone" id="dropZone" tabindex="0" role="button" aria-label="拖入文件或点击选择">
          <div class="dropicon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 21V8m0 0-5 5m5-5 5 5"/><path d="M6.5 21v4.5h19V21"/></svg></div>
          <h2>拖入文件，或点击选择</h2>
          <p>支持图片、PDF、音视频、文档和压缩包</p>
          <button class="primary-btn" id="chooseButton">选择文件</button>
          <div class="dhint"><span>✓ 批量处理</span><span>✓ 文件不上传</span><span>✓ 保留原文件</span></div>
        </div>
        <div class="quick">
          <p>常用工具</p>
          <div class="quick-grid">
            <button class="quick-card" data-tool="image-optimize"><span class="qi img">⇣</span><span><strong>压缩图片</strong><small>指定体积，或选一个压缩强度</small></span><b>→</b></button>
            <button class="quick-card" data-tool="image-adjust"><span class="qi img">⌗</span><span><strong>裁剪与尺寸</strong><small>取景和分辨率一次调好</small></span><b>→</b></button>
            <button class="quick-card" data-tool="image-convert"><span class="qi img">⇄</span><span><strong>转换图片格式</strong><small>JPG / PNG / WebP / AVIF</small></span><b>→</b></button>
            <button class="quick-card" data-tool="pdf-merge"><span class="qi pdf">▤</span><span><strong>合并 PDF</strong><small>按顺序合成一个文档</small></span><b>→</b></button>
            <button class="quick-card" data-tool="media-convert"><span class="qi media">▶</span><span><strong>音视频转换</strong><small>换格式、压体积、截片段</small></span><b>→</b></button>
            <button class="quick-card" data-tool="archive-create"><span class="qi zip">⌑</span><span><strong>打包成 ZIP</strong><small>把多个文件整理成压缩包</small></span><b>→</b></button>
          </div>
        </div>
      </section>

      <!-- 工作区 -->
      <section class="workspace" id="workspace" hidden>
        <div class="work">
          <section class="card strip">
            <div class="strip-head">
              <h2 id="stripTitle">文件</h2><span class="badge" id="fileCount">0</span>
              <span class="grow"></span>
              <button class="batch" id="sharedCropButton" hidden><span class="sw"></span><span id="sharedCropLabel">统一裁切：关</span></button>
              <button class="mini-btn" id="addButton">＋ 添加</button>
            </div>
            <div class="thumbs" id="thumbs"></div>
          </section>

          <section class="card preview" id="previewCard">
            <div class="pv-head">
              <div class="pv-title"><strong id="pvName">—</strong><span id="pvSub">—</span></div>
              <div class="pv-tools">
                <button class="tool" id="compareButton" hidden>对比原图</button>
                <div class="zoom" id="zoomBox" hidden>
                  <button data-zoom="out" aria-label="缩小">−</button>
                  <span id="zoomLabel">适应</span>
                  <button data-zoom="in" aria-label="放大">＋</button>
                </div>
              </div>
            </div>
            <div class="stage" id="stage">
              <div class="frame" id="frame" hidden>
                <img id="previewImage" alt="预览" />
                <div class="split-layer" id="splitLayer" hidden><img id="splitImage" alt="原图" /></div>
                <span class="tag tag-a" id="tagA" hidden>原图</span>
                <span class="tag tag-b" id="tagB" hidden>处理后</span>
                <div class="split-line" id="splitLine" hidden></div>
                <button class="split-knob" id="splitKnob" hidden>⇔</button>
                <div class="crop" id="cropOverlay" hidden tabindex="0">
                  <span class="crop-lock" id="cropLock" hidden></span>
                  <div class="grid"></div>
                  <i class="h nw" data-handle="nw"></i><i class="h ne" data-handle="ne"></i>
                  <i class="h sw" data-handle="sw"></i><i class="h se" data-handle="se"></i>
                  <i class="h n" data-handle="n"></i><i class="h s" data-handle="s"></i>
                  <i class="h w" data-handle="w"></i><i class="h e" data-handle="e"></i>
                  <span class="crop-badge" id="cropBadge">—</span>
                </div>
              </div>
              <div class="stage-note" id="stageNote" hidden></div>
              <span class="stage-busy" id="stageBusy" hidden>正在生成预览…</span>
            </div>
            <div class="pv-foot"><span id="pvHint">—</span><span id="pvOut"></span></div>
          </section>

          <section class="card sizes" id="sizesCard" hidden>
            <div class="size-item"><span>原图</span><div class="bar"><i id="barOriginal" style="width:100%"></i></div><b id="sizeOriginal">—</b></div>
            <div class="size-item"><span>处理后</span><div class="bar filled"><i id="barResult"></i></div><b id="sizeResult">—</b></div>
            <div class="verdict" id="verdict">正在估算…</div>
          </section>

          <section class="card result" id="resultCard" hidden>
            <div class="result-head">
              <span class="ok-icon">✓</span>
              <div><h2>处理完成</h2><p id="resultSummary">—</p></div>
              <button class="mini-btn" id="openFolderButton">打开文件夹</button>
            </div>
            <div class="result-list" id="resultList"></div>
          </section>
        </div>

        <aside class="card side">
          <div class="side-head">
            <h1 id="opTitle">—</h1>
            <p id="opDesc">—</p>
            <div class="tabs" id="opTabs"></div>
          </div>
          <div class="side-scroll" id="settings"></div>
          <div class="side-foot">
            <div class="progress-mini" id="progressMini" hidden>
              <div class="pbar"><i id="progressFill"></i></div>
              <span id="progressText">0%</span>
            </div>
            <div class="estimate"><span>预计输出</span><strong id="estimateText">—</strong></div>
            <div class="cta-row">
              <button class="cta" id="runButton"><span id="runLabel">开始处理</span><b>→</b></button>
              <button class="cancel-btn" id="cancelButton" hidden>取消</button>
            </div>
            <p class="engine" id="engineStatus">正在检查处理引擎…</p>
          </div>
        </aside>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="renderer-v2.js"></script>
  </body>
</html>
